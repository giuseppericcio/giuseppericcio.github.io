---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="post-meta"><a href="{{ '/blog/' | relative_url }}">Blog</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time></p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <nav class="post-nav">
    {%- if page.previous.url %}<a href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
    {%- if page.next.url %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>{% endif %}
  </nav>

  {% if site.comments_repo %}{% include comments.html %}{% endif %}
</article>
