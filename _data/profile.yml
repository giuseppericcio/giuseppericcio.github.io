# Header and "About" section of the home page.
name: Giuseppe Riccio
photo: https://github.com/giuseppericcio.png?size=400
roles:
  - Post-Graduate Research Fellow in Data Engineering & AI
  - University of Naples Federico II · PRAISE Lab / PICUS Lab
bio: >
  I work on **AI for healthcare**: language and vision-language models for clinical text and images,
  multi-agent LLM systems for medical question answering, retrieval-augmented generation over
  graphs and hypergraphs, and evidence-based fact-checking of biomedical claims.
  I care about releasing what I build: most of my papers come with open code, datasets and demos
  on GitHub and Hugging Face.
bio_more: >
  I received my MSc (2024) and BSc (2021) in Computer Engineering, both with honors, from the
  University of Naples Federico II, where I now carry out my research in the
  [PRAISE Lab / PICUS Lab](https://github.com/PRAISELab-PicusLab).
